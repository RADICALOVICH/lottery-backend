plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.team'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    javalinVersion = '6.7.0'
    jacksonVersion = '2.17.2'
    postgresVersion = '42.7.4'
    hikariVersion = '5.1.0'
    flywayVersion = '10.17.0'
    bcryptVersion = '0.10.2'
    slf4jVersion = '2.0.13'
    logbackVersion = '1.5.6'

    junitVersion = '5.10.3'
    assertjVersion = '3.26.3'
    mockitoVersion = '5.12.0'
    testcontainersVersion = '1.21.4'
    restAssuredVersion = '5.5.0'
}

dependencies {
    // HTTP + JSON
    implementation "io.javalin:javalin:$javalinVersion"
    implementation "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:$jacksonVersion"

    // Database
    implementation "org.postgresql:postgresql:$postgresVersion"
    implementation "com.zaxxer:HikariCP:$hikariVersion"
    implementation "org.flywaydb:flyway-core:$flywayVersion"
    implementation "org.flywaydb:flyway-database-postgresql:$flywayVersion"

    // Security
    implementation "at.favre.lib:bcrypt:$bcryptVersion"

    // Logging
    implementation "org.slf4j:slf4j-api:$slf4jVersion"
    implementation "ch.qos.logback:logback-classic:$logbackVersion"

    // Testing
    testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
    testImplementation "org.assertj:assertj-core:$assertjVersion"
    testImplementation "org.mockito:mockito-core:$mockitoVersion"
    testImplementation "org.mockito:mockito-junit-jupiter:$mockitoVersion"
    testImplementation "org.testcontainers:postgresql:$testcontainersVersion"
    testImplementation "org.testcontainers:junit-jupiter:$testcontainersVersion"
    testImplementation "io.rest-assured:rest-assured:$restAssuredVersion"
}

application {
    mainClass = 'com.team.lottery.Application'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = false
    }
}

// Shadow JAR для Docker: один исполняемый jar со всеми зависимостями
shadowJar {
    archiveBaseName = 'lottery-backend'
    archiveClassifier = ''
    archiveVersion = ''
    mergeServiceFiles()
}

build.dependsOn shadowJar
