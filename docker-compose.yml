version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: lottery-db
    environment:
      POSTGRES_DB: lottery
      POSTGRES_USER: lottery
      POSTGRES_PASSWORD: lottery_dev_password
    # На хосте маппим 5433, чтобы не конфликтовать с локально установленным Postgres.
    # Внутри compose-сети app ходит к db:5432 — внутренний порт контейнера не меняется.
    ports:
      - "5433:5432"
    volumes:
      - lottery_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lottery -d lottery"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["full"]
    build: .
    container_name: lottery-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/lottery
      DB_USER: lottery
      DB_PASSWORD: lottery_dev_password
      DB_POOL_SIZE: 10
      BCRYPT_COST: 12
      DRAW_SCHEDULER_INTERVAL_SECONDS: 60
    ports:
      - "8080:8080"

volumes:
  lottery_pgdata:
